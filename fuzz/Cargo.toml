[package]
name = "rukn-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rukn = { path = ".." }

[[bin]]
name = "run_source"
path = "fuzz_targets/run_source.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "3"
