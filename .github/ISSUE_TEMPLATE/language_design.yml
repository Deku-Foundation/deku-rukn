name: Language design proposal
description: Propose a syntax or semantics change before implementation.
title: "[RFC]: "
labels: ["language-design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Proposed Arabic syntax and examples
      description: Include valid and invalid examples, plus the expected result.
      render: text
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
    validations:
      required: true
