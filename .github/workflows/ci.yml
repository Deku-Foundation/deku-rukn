name: Quality gates

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rukn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Verify example program
        run: |
          cargo run --locked -- examples/hello.rukn > /tmp/rukn-output.txt
          diff -u <(printf 'مرحبًا يا العالم\n42\nخطأ\nصحيح\n') /tmp/rukn-output.txt
      - name: Verify function and recursion example
        run: |
          cargo run --locked -- examples/functions.rukn > /tmp/rukn-functions-output.txt
          diff -u <(printf '42\n120\n5\n9\n') /tmp/rukn-functions-output.txt

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build documentation
        run: npm run build
      - name: Check localized UI contract
        run: npm run check:ui
