name: Safely remove redundant branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to delete only if its complete tree exactly matches main"
        required: true
        type: string
        default: "feat/rukn-interpreter-and-docs-v0-1"

permissions:
  contents: write

jobs:
  delete-redundant-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify branch is safe to remove
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            main|dev|"") echo "Refusing to delete main, dev, or an empty branch name." >&2; exit 2 ;;
          esac
          if [[ "$TARGET_BRANCH" == *".."* || "$TARGET_BRANCH" == *"//"* || "$TARGET_BRANCH" == /* || "$TARGET_BRANCH" == *".lock" ]]; then
            echo "Invalid branch name." >&2
            exit 2
          fi
          if ! git check-ref-format "refs/heads/$TARGET_BRANCH"; then
            echo "Invalid branch name." >&2
            exit 2
          fi
          git fetch origin main
          git fetch origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/cleanup-target"
          if ! git diff --quiet origin/main refs/remotes/origin/cleanup-target; then
            echo "Refusing to delete: branch content differs from main. Merge or preserve its work first." >&2
            exit 3
          fi
          echo "Branch tree matches main exactly; deletion is safe."
      - name: Delete verified redundant branch
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: git push origin --delete "$TARGET_BRANCH"
