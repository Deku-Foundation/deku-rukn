name: Safely remove redundant branches

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Optional branch to delete only if its complete tree exactly matches main; blank checks all branches"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  delete-redundant-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Delete only branches whose tree exactly matches main
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ -n "$TARGET_BRANCH" ]]; then
            branches=("$TARGET_BRANCH")
          else
            mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          fi

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|dev|"") echo "Keeping protected/persistent branch: $branch"; continue ;;
            esac
            if [[ "$branch" == *".."* || "$branch" == *"//"* || "$branch" == /* || "$branch" == *".lock" ]] || ! git check-ref-format "refs/heads/$branch"; then
              echo "Skipping invalid branch name: $branch"
              continue
            fi

            remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR==1 {print $1}')"
            if [[ -z "$remote_sha" ]]; then
              echo "Branch disappeared before inspection: $branch"
              continue
            fi
            git fetch origin "+refs/heads/$branch:refs/remotes/origin/cleanup-target"
            fetched_sha="$(git rev-parse refs/remotes/origin/cleanup-target)"
            if [[ "$remote_sha" != "$fetched_sha" ]]; then
              echo "Branch moved during inspection; preserving: $branch"
              continue
            fi
            if ! git diff --quiet origin/main refs/remotes/origin/cleanup-target; then
              echo "Preserving branch with unique content: $branch"
              continue
            fi

            echo "Deleting redundant branch with tree identical to main: $branch"
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin ":refs/heads/$branch"
          done
