name: Fuzz smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - ".github/workflows/fuzz-smoke.yml"

permissions:
  contents: read

concurrency:
  group: rukn-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interpreter-fuzz:
    name: Bounded interpreter fuzz smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, llvm-tools-preview
      - name: Install pinned cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz-target formatting
        run: cargo +nightly fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Build raw-input fuzz target
        run: cargo +nightly fuzz build run_source
      - name: Build structured-program fuzz target
        run: cargo +nightly fuzz build generated_program
      - name: Run bounded raw-input libFuzzer campaign
        run: cargo +nightly fuzz run run_source -- -max_total_time=60 -timeout=5 -max_len=16384 -print_final_stats=1
      - name: Run bounded structured-program libFuzzer campaign
        run: cargo +nightly fuzz run generated_program -- -max_total_time=60 -timeout=5 -max_len=256 -print_final_stats=1
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rukn-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
