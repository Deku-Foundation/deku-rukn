name: Fuzz smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "src/**"
      - "fuzz/**"
      - ".github/workflows/fuzz-smoke.yml"

permissions:
  contents: read

concurrency:
  group: rukn-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interpreter-fuzz:
    name: Bounded interpreter fuzz smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, llvm-tools-preview
      - name: Install pinned cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Check fuzz-target formatting
        run: cargo +nightly fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Build fuzz target
        run: cargo +nightly fuzz build run_source
      - name: Run bounded libFuzzer campaign
        run: cargo +nightly fuzz run run_source -- -max_total_time=60 -timeout=5 -max_len=16384 -print_final_stats=1
